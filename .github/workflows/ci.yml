name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Go quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            Makefile

      - name: Verify dependencies
        run: |
          go mod download
          # Run before codegen, like Dependabot's source-only checkout.
          make deps-check

      - name: Check committed protobuf code
        run: make buf-check

      - name: Generate protobuf and dependency injection code
        run: make codegen

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: make test

      - name: Verify visual CI fixture boundaries
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/acceptance -p 'test_visual*.py'

      - name: Verify terminal rerun evidence and workflow boundaries
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/acceptance -p 'test_verify_copilot_rerun_mysql_log.py'
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/acceptance -p 'test_terminal_rerun_workflow.py'

      - name: Build all commands
        run: go build ./cmd/...

  acceptance:
    name: Real dependencies and actual browser journey
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local
      ARCENTRA_REAL_STACK: "1"
      ARCENTRA_REQUIRE_REAL_STACK: "1"
      ARCENTRA_TEST_MYSQL_DSN: "root:ci-only-mysql-password@tcp(127.0.0.1:13306)/arcentra_acceptance?charset=utf8mb4&parseTime=True&loc=UTC"
      ARCENTRA_TEST_KAFKA_BROKERS: "127.0.0.1:19092"
      ARCENTRA_TEST_REDIS_ADDRESS: "127.0.0.1:16379"
      ARCENTRA_TEST_S3_ENDPOINT: "http://127.0.0.1:19000"
      ARCENTRA_TEST_S3_ACCESS_KEY: ci-only-s3-user
      ARCENTRA_TEST_S3_SECRET_KEY: ci-only-s3-password
      COMPOSE_PROJECT_NAME: arcentra-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out backend under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            scripts/acceptance/minio.Dockerfile

      - name: Generate and build actual application binaries
        run: |
          make codegen
          mkdir -p .acceptance/bin .acceptance/evidence
          go build -o .acceptance/bin/arcentra ./cmd/arcentra
          go build -o .acceptance/bin/arcentra-agent ./cmd/arcentra-agent
          go build -o .acceptance/bin/arcentra-cli ./cmd/cli

      - name: Check out official source-only MinIO release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: minio/minio
          # RELEASE.2025-10-15T17-29-55Z; official source, no registry credentials.
          ref: 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
          path: .acceptance/minio-source
          persist-credentials: false

      - name: Build disposable MinIO image from verified source
        timeout-minutes: 12
        run: |
          test "$(git -C .acceptance/minio-source rev-parse HEAD)" = 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
          mkdir -p .acceptance/minio-image
          (cd .acceptance/minio-source && CGO_ENABLED=0 go build -mod=readonly -trimpath -o ../minio-image/minio .)
          cp .acceptance/minio-source/LICENSE .acceptance/minio-source/NOTICE .acceptance/minio-image/
          docker build -f scripts/acceptance/minio.Dockerfile -t arcentra-ci-minio:9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a .acceptance/minio-image

      - name: Mask disposable fixture credentials
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/arcentra-playwright" >> "$GITHUB_ENV"
          echo "::add-mask::ci-only-mysql-password"
          echo "::add-mask::ci-only-s3-password"
          echo "::add-mask::Ci-Only-Password-123!"

      - name: Start disposable loopback dependencies
        run: |
          docker compose -f scripts/acceptance/compose.yml up -d --wait --wait-timeout 180
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:19000/minio/health/ready >/dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then exit 1; fi
            sleep 2
          done
          go run scripts/acceptance/create_bucket.go

      - name: Verify failed-step admission against disposable MySQL
        timeout-minutes: 3
        env:
          ARCENTRA_STEP_ATTEMPT_MYSQL_TEST: "1"
          ARCENTRA_STEP_ATTEMPT_MYSQL_DSN: "root:ci-only-mysql-password@tcp(127.0.0.1:13306)/arcentra_step_attempt_test_ci?charset=utf8mb4&parseTime=True&loc=UTC"
        run: |
          set -o pipefail
          # A fresh schema on this run's existing disposable server only.
          # The fixture refuses nonempty schemas and never creates databases or grants.
          docker compose -f scripts/acceptance/compose.yml exec -T -e MYSQL_PWD=ci-only-mysql-password mysql mysqladmin -uroot create arcentra_step_attempt_test_ci
          test_name=TestStepAttemptMySQLExplicitOptInCASAndCancellation
          go test -race -count=1 -timeout=2m -v -run "^${test_name}$" ./internal/control/repo | tee .acceptance/evidence/step-attempt-mysql.log
          python3 scripts/acceptance/verify_containerd_test_log.py .acceptance/evidence/step-attempt-mysql.log 1 \
            "$test_name" \
            "$test_name/equal_and_conflicting_CAS_current_reports_and_upload_winner" \
            "$test_name/cancel_before_advance" \
            "$test_name/advance_before_cancel" \
            "$test_name/cancel_before_publication" \
            "$test_name/publication_before_cancel"

      - name: Verify storage configuration transactions with actual MySQL
        timeout-minutes: 5
        run: |
          set -o pipefail
          for attempt in 1 2; do
            schema="arcentra_storage_test_$attempt"
            docker compose -f scripts/acceptance/compose.yml exec -T -e MYSQL_PWD=ci-only-mysql-password mysql mysqladmin -uroot create "$schema"
            ARCENTRA_REQUIRE_STORAGE_MYSQL=1 \
            ARCENTRA_STORAGE_MYSQL_DSN="root:ci-only-mysql-password@tcp(127.0.0.1:13306)/$schema?charset=utf8mb4&parseTime=True&loc=UTC" \
              go test -race -v -count=1 -timeout=2m -run '^TestStorageMySQLAcceptance$' ./internal/control/repo | tee ".acceptance/evidence/storage-mysql-$attempt.log"
            python3 scripts/acceptance/verify_containerd_test_log.py ".acceptance/evidence/storage-mysql-$attempt.log" 1 \
              TestStorageMySQLAcceptance \
              TestStorageMySQLAcceptance/concurrent_first_default_creation \
              TestStorageMySQLAcceptance/concurrent_first_duplicate_creation \
              TestStorageMySQLAcceptance/concurrent_duplicate_creation \
              TestStorageMySQLAcceptance/concurrent_existing_default_switches \
              TestStorageMySQLAcceptance/invalid_target_preserves_default \
              TestStorageMySQLAcceptance/failed_target_update_rolls_back \
              TestStorageMySQLAcceptance/concurrent_credential_rotation_and_metadata_edit
          done

      - name: Verify real broker, MySQL, S3 and Agent execution
        run: |
          set -o pipefail
          for attempt in 1 2; do
            schema="arcentra_acceptance_realstack_$attempt"
            docker compose -f scripts/acceptance/compose.yml exec -T -e MYSQL_PWD=ci-only-mysql-password mysql mysqladmin -uroot create "$schema"
            ARCENTRA_TEST_MYSQL_DSN="root:ci-only-mysql-password@tcp(127.0.0.1:13306)/$schema?charset=utf8mb4&parseTime=True&loc=UTC" \
              go test -race -count=1 -timeout=8m -v -run '^TestRealStackAcceptance$' ./internal/agent/taskqueue | tee ".acceptance/evidence/real-stack-$attempt.log"
            python3 scripts/acceptance/verify_containerd_test_log.py ".acceptance/evidence/real-stack-$attempt.log" 1 \
              TestRealStackAcceptance \
              TestRealStackAcceptance/signed_webhook_terminal_redelivery \
              TestRealStackAcceptance/signed_webhook_schema_rejection \
              TestRealStackAcceptance/automatic_mysql_accept_before_reject \
              TestRealStackAcceptance/automatic_mysql_reject_before_accept \
              TestRealStackAcceptance/automatic_mysql_accept_before_accept \
              TestRealStackAcceptance/polling_baseline_enable_changed_observation \
              TestRealStackAcceptance/polling_duplicate_no_execution \
              TestRealStackAcceptance/polling_no_eligible_ref_completes \
              TestRealStackAcceptance/polling_revoke_before_admission \
              TestRealStackAcceptance/polling_github_baseline_enable_changed_observation \
              TestRealStackAcceptance/polling_github_duplicate_no_execution \
              TestRealStackAcceptance/polling_github_no_eligible_ref_completes \
              TestRealStackAcceptance/polling_github_revoke_before_admission \
              TestRealStackAcceptance/polling_gitea_baseline_enable_changed_observation \
              TestRealStackAcceptance/polling_gitea_duplicate_no_execution \
              TestRealStackAcceptance/polling_gitea_no_eligible_ref_completes \
              TestRealStackAcceptance/polling_gitea_revoke_before_admission \
              TestRealStackAcceptance/polling_gitee_baseline_enable_changed_observation \
              TestRealStackAcceptance/polling_gitee_duplicate_no_execution \
              TestRealStackAcceptance/polling_gitee_no_eligible_ref_completes \
              TestRealStackAcceptance/polling_gitee_merged_observation_metadata_no_rerun \
              TestRealStackAcceptance/polling_gitee_revoke_before_admission \
              TestRealStackAcceptance/polling_gitee_malformed_evidence_pauses \
              TestRealStackAcceptance/polling_bitbucket_baseline_enable_changed_observation \
              TestRealStackAcceptance/polling_bitbucket_duplicate_no_execution \
              TestRealStackAcceptance/polling_bitbucket_no_eligible_ref_completes \
              TestRealStackAcceptance/polling_bitbucket_merged_observation_metadata_no_rerun \
              TestRealStackAcceptance/polling_bitbucket_revoke_before_admission \
              TestRealStackAcceptance/polling_bitbucket_malformed_evidence_pauses
          done
          go test -race -count=1 -timeout=2m -run '^TestRegisterLoginWithRealRedis$' ./internal/control/service

      - name: Verify provider polling durable activation with actual MySQL
        timeout-minutes: 5
        run: |
          set -o pipefail
          for attempt in 1 2; do
            schema="arcentra_polling_test_ci_$attempt"
            docker compose -f scripts/acceptance/compose.yml exec -T -e MYSQL_PWD=ci-only-mysql-password mysql mysqladmin -uroot create "$schema"
            ARCENTRA_REQUIRE_POLLING_MYSQL=1 \
            ARCENTRA_POLLING_MYSQL_DSN="root:ci-only-mysql-password@tcp(127.0.0.1:13306)/$schema?charset=utf8mb4&parseTime=True&loc=UTC" \
              go test -race -v -count=1 -timeout=2m -run '^TestPollingMySQLAcceptance$' ./internal/control/repo | tee ".acceptance/evidence/polling-mysql-$attempt.log"
            python3 scripts/acceptance/verify_containerd_test_log.py ".acceptance/evidence/polling-mysql-$attempt.log" 1 \
              TestPollingMySQLAcceptance \
              TestPollingMySQLAcceptance/explicit_migration_is_inactive_and_preserves_legacy_data \
              TestPollingMySQLAcceptance/committed_scope_revocation_defeats_repeatable_read_snapshot \
              TestPollingMySQLAcceptance/disable_wins_before_admission \
              TestPollingMySQLAcceptance/project_configuration_wins_before_admission \
              TestPollingMySQLAcceptance/pipeline_configuration_wins_before_admission \
              TestPollingMySQLAcceptance/admission_wins_and_later_disable_preserves_receipt \
              TestPollingMySQLAcceptance/concurrent_duplicate_creation_has_one_created_now \
              TestPollingMySQLAcceptance/cursor_cas_failure_replays_without_reclaim \
              TestPollingMySQLAcceptance/github/empty_eligible_targets_completes_without_build \
              TestPollingMySQLAcceptance/github/committed_scope_revocation_defeats_repeatable_read_snapshot \
              TestPollingMySQLAcceptance/github/disable_wins_before_admission \
              TestPollingMySQLAcceptance/github/project_configuration_wins_before_admission \
              TestPollingMySQLAcceptance/github/pipeline_configuration_wins_before_admission \
              TestPollingMySQLAcceptance/github/provider_configuration_wins_before_admission \
              TestPollingMySQLAcceptance/github/archive_wins_before_admission \
              TestPollingMySQLAcceptance/github/admission_wins_and_later_disable_preserves_receipt \
              TestPollingMySQLAcceptance/github/concurrent_duplicate_creation_has_one_created_now \
              TestPollingMySQLAcceptance/github/cursor_cas_failure_replays_without_reclaim \
              TestPollingMySQLAcceptance/gitea/empty_eligible_targets_completes_without_build \
              TestPollingMySQLAcceptance/gitea/committed_scope_revocation_defeats_repeatable_read_snapshot \
              TestPollingMySQLAcceptance/gitea/disable_wins_before_admission \
              TestPollingMySQLAcceptance/gitea/project_configuration_wins_before_admission \
              TestPollingMySQLAcceptance/gitea/pipeline_configuration_wins_before_admission \
              TestPollingMySQLAcceptance/gitea/provider_configuration_wins_before_admission \
              TestPollingMySQLAcceptance/gitea/archive_wins_before_admission \
              TestPollingMySQLAcceptance/gitea/admission_wins_and_later_disable_preserves_receipt \
              TestPollingMySQLAcceptance/gitea/concurrent_duplicate_creation_has_one_created_now \
              TestPollingMySQLAcceptance/gitea/cursor_cas_failure_replays_without_reclaim \
              TestPollingMySQLAcceptance/gitee/empty_eligible_targets_completes_without_build \
              TestPollingMySQLAcceptance/gitee/committed_scope_revocation_defeats_repeatable_read_snapshot \
              TestPollingMySQLAcceptance/gitee/disable_wins_before_admission \
              TestPollingMySQLAcceptance/gitee/project_configuration_wins_before_admission \
              TestPollingMySQLAcceptance/gitee/pipeline_configuration_wins_before_admission \
              TestPollingMySQLAcceptance/gitee/provider_configuration_wins_before_admission \
              TestPollingMySQLAcceptance/gitee/archive_wins_before_admission \
              TestPollingMySQLAcceptance/gitee/admission_wins_and_later_disable_preserves_receipt \
              TestPollingMySQLAcceptance/gitee/concurrent_duplicate_creation_has_one_created_now \
              TestPollingMySQLAcceptance/gitee/cursor_cas_failure_replays_without_reclaim \
              TestPollingMySQLAcceptance/gitee/v3_merged_evidence_survives_replay_admission \
              TestPollingMySQLAcceptance/bitbucket/empty_eligible_targets_completes_without_build \
              TestPollingMySQLAcceptance/bitbucket/committed_scope_revocation_defeats_repeatable_read_snapshot \
              TestPollingMySQLAcceptance/bitbucket/disable_wins_before_admission \
              TestPollingMySQLAcceptance/bitbucket/project_configuration_wins_before_admission \
              TestPollingMySQLAcceptance/bitbucket/pipeline_configuration_wins_before_admission \
              TestPollingMySQLAcceptance/bitbucket/provider_configuration_wins_before_admission \
              TestPollingMySQLAcceptance/bitbucket/archive_wins_before_admission \
              TestPollingMySQLAcceptance/bitbucket/admission_wins_and_later_disable_preserves_receipt \
              TestPollingMySQLAcceptance/bitbucket/concurrent_duplicate_creation_has_one_created_now \
              TestPollingMySQLAcceptance/bitbucket/cursor_cas_failure_replays_without_reclaim \
              TestPollingMySQLAcceptance/bitbucket/v3_merged_evidence_survives_replay_admission
          done

      - name: Verify scoped membership and archive admission with actual MySQL
        timeout-minutes: 5
        run: |
          set -o pipefail
          for attempt in 1 2; do
            schema="arcentra_retry_approval_test_org_$attempt"
            admission_schema="arcentra_project_admission_test_ci_$attempt"
            collation=utf8mb4_0900_ai_ci
            if [ "$attempt" = 2 ]; then collation=utf8mb4_bin; fi
            docker compose -f scripts/acceptance/compose.yml exec -T -e MYSQL_PWD=ci-only-mysql-password mysql mysql -uroot -e "CREATE DATABASE $schema CHARACTER SET utf8mb4 COLLATE $collation; CREATE DATABASE $admission_schema CHARACTER SET utf8mb4 COLLATE $collation;"
            ARCENTRA_REQUIRE_RETRY_APPROVAL_MYSQL=1 \
            ARCENTRA_RETRY_APPROVAL_MYSQL_DSN="root:ci-only-mysql-password@tcp(127.0.0.1:13306)/$schema?charset=utf8mb4&parseTime=True&loc=UTC" \
              go test -race -v -count=1 -timeout=2m -run '^Test(OrganizationMySQL|ProjectSettingsMySQL|ProjectSecretsMySQL)' ./internal/control/repo | tee ".acceptance/evidence/organization-mysql-$attempt.log"
            python3 scripts/acceptance/verify_containerd_test_log.py ".acceptance/evidence/organization-mysql-$attempt.log" 1 \
              TestOrganizationMySQLConcurrentMemberCASAndScopeIsolation \
              TestOrganizationMySQLRevocationSerializesBeforeMemberAdmission \
              TestOrganizationMySQLArchiveSerializesProjectCreation \
              TestOrganizationMySQLCaseCollidingIdentityDenies \
              TestOrganizationMySQLLastOwnerMutationsSerialize \
              TestOrganizationMySQLCollationAliasCannotBypassFrozenLifecycle \
              TestOrganizationMySQLListAndCreateDoNotInvertDomainLocks \
              TestOrganizationMySQLMigrationUpgradesOldShape \
              TestProjectSettingsMySQLCASAndRollback \
              TestProjectSecretsMySQLConcurrentCASRollbackAndRevocation \
              TestProjectSecretsMySQLCipherBudgetUsesCurrentLockedMetadata \
              TestProjectSecretsMySQLSchemaUpgradePreservesLegacyCiphertext
            ARCENTRA_REQUIRE_PROJECT_ADMISSION_MYSQL=1 \
            ARCENTRA_PROJECT_ADMISSION_MYSQL_DSN="root:ci-only-mysql-password@tcp(127.0.0.1:13306)/$admission_schema?charset=utf8mb4&parseTime=True&loc=UTC" \
              go test -race -v -count=1 -timeout=2m -run '^TestProjectAdmissionMySQLArchiveSerialization$' ./internal/control/repo | tee ".acceptance/evidence/project-admission-mysql-$attempt.log"
            python3 scripts/acceptance/verify_containerd_test_log.py ".acceptance/evidence/project-admission-mysql-$attempt.log" 1 \
              TestProjectAdmissionMySQLArchiveSerialization \
              TestProjectAdmissionMySQLArchiveSerialization/manual/archive-first-true \
              TestProjectAdmissionMySQLArchiveSerialization/manual/archive-first-false \
              TestProjectAdmissionMySQLArchiveSerialization/automatic/archive-first-true \
              TestProjectAdmissionMySQLArchiveSerialization/automatic/archive-first-false \
              TestProjectAdmissionMySQLArchiveSerialization/polling/archive-first-true \
              TestProjectAdmissionMySQLArchiveSerialization/polling/archive-first-false \
              TestProjectAdmissionMySQLArchiveSerialization/manual/project-move-first-true \
              TestProjectAdmissionMySQLArchiveSerialization/manual/project-move-first-false \
              TestProjectAdmissionMySQLArchiveSerialization/automatic/project-move-first-true \
              TestProjectAdmissionMySQLArchiveSerialization/automatic/project-move-first-false
          done

      - name: Verify durable approval with actual MySQL authorization contention
        timeout-minutes: 5
        run: |
          set -o pipefail
          for suite in repo service; do
            schema="arcentra_retry_approval_test_$suite"
            docker compose -f scripts/acceptance/compose.yml exec -T -e MYSQL_PWD=ci-only-mysql-password mysql mysqladmin -uroot create "$schema"
            ARCENTRA_REQUIRE_RETRY_APPROVAL_MYSQL=1 \
            ARCENTRA_RETRY_APPROVAL_MYSQL_DSN="root:ci-only-mysql-password@tcp(127.0.0.1:13306)/$schema?charset=utf8mb4&parseTime=True&loc=UTC" \
              go test -race -v -count=1 -timeout=2m -run '^TestRetryApprovalMySQL' "./internal/control/$suite" | tee ".acceptance/evidence/retry-approval-mysql-$suite.log"
            grep -q '^--- PASS: TestRetryApprovalMySQL' ".acceptance/evidence/retry-approval-mysql-$suite.log"
            if grep -q '^--- SKIP: TestRetryApprovalMySQL' ".acceptance/evidence/retry-approval-mysql-$suite.log"; then exit 1; fi
            if [ "$suite" = service ]; then
              audit_test=TestRetryApprovalMySQLLosslessAuditActionsBothCollations
              python3 scripts/acceptance/verify_containerd_test_log.py ".acceptance/evidence/retry-approval-mysql-$suite.log" 1 \
                TestRetryApprovalMySQLCanonicalPermissionProjection \
                "$audit_test" "$audit_test/utf8mb4_0900_ai_ci" "$audit_test/utf8mb4_bin"
            fi
          done

      - name: Verify approved live-step admission with actual MySQL authorization
        timeout-minutes: 5
        run: |
          set -o pipefail
          for suite in repo service; do
            schema="arcentra_retry_approval_test_step_$suite"
            docker compose -f scripts/acceptance/compose.yml exec -T -e MYSQL_PWD=ci-only-mysql-password mysql mysqladmin -uroot create "$schema"
            ARCENTRA_REQUIRE_RETRY_APPROVAL_MYSQL=1 \
            ARCENTRA_RETRY_APPROVAL_MYSQL_DSN="root:ci-only-mysql-password@tcp(127.0.0.1:13306)/$schema?charset=utf8mb4&parseTime=True&loc=UTC" \
              go test -race -v -count=1 -timeout=2m -run '^TestStepRetryApprovalMySQL' "./internal/control/$suite" | tee ".acceptance/evidence/step-retry-approval-mysql-$suite.log"
            python3 scripts/acceptance/verify_step_approval_mysql_log.py ".acceptance/evidence/step-retry-approval-mysql-$suite.log" "$suite"
          done

      - name: Verify durable personal Inbox against disposable MySQL
        timeout-minutes: 5
        run: |
          set -o pipefail
          for suite in provenance migration audit_action service; do
            if [ "$suite" = service ]; then
              schema=arcentra_retry_approval_test_inbox
              test_name=TestInboxMySQLVerifiedRetryServiceJourney
              package=service
            else
              schema="arcentra_inbox_test_$suite"
              package=repo
              if [ "$suite" = provenance ]; then
                test_name=TestManualInboxMySQLProvenanceBothCollations
              elif [ "$suite" = audit_action ]; then
                test_name=TestAuditActionMySQLLosslessSchema
              else
                test_name=TestInboxMySQLRealOldShapeMigrationAndLargeHistoryPlans
              fi
            fi
            docker compose -f scripts/acceptance/compose.yml exec -T -e MYSQL_PWD=ci-only-mysql-password mysql mysqladmin -uroot create "$schema"
            ARCENTRA_REQUIRE_INBOX_MYSQL=1 \
            ARCENTRA_INBOX_MYSQL_DSN="root:ci-only-mysql-password@tcp(127.0.0.1:13306)/$schema?charset=utf8mb4&parseTime=True&loc=UTC" \
            ARCENTRA_REQUIRE_RETRY_APPROVAL_MYSQL=1 \
            ARCENTRA_RETRY_APPROVAL_MYSQL_DSN="root:ci-only-mysql-password@tcp(127.0.0.1:13306)/$schema?charset=utf8mb4&parseTime=True&loc=UTC" \
              go test -race -v -count=1 -timeout=3m -run "^$test_name$" "./internal/control/$package" | tee ".acceptance/evidence/inbox-mysql-$suite.log"
            if [ "$suite" = audit_action ]; then
              required=("$test_name")
              for collation in utf8mb4_0900_ai_ci utf8mb4_bin; do
                for case in fresh upgrade unrelated_preflight_rejected_before_audit_ddl; do
                  required+=("$test_name/$collation/$case")
                done
                for case in varchar_33 nullable default missing_index wrong_column composite_index unique_index legacy_prefix wrong_longtext_prefix extra_action_index functional_index invisible_index descending_index; do
                  required+=("$test_name/$collation/unknown_shapes_rejected_before_ddl/$case")
                done
              done
              python3 scripts/acceptance/verify_containerd_test_log.py ".acceptance/evidence/inbox-mysql-$suite.log" 1 "${required[@]}"
            else
              python3 scripts/acceptance/verify_inbox_mysql_log.py ".acceptance/evidence/inbox-mysql-$suite.log" "$suite"
            fi
          done

      - name: Verify private Copilot history against disposable MySQL
        timeout-minutes: 4
        run: |
          set -o pipefail
          schema=arcentra_copilot_history_test_ci
          docker compose -f scripts/acceptance/compose.yml exec -T -e MYSQL_PWD=ci-only-mysql-password mysql mysqladmin -uroot create "$schema"
          ARCENTRA_REQUIRE_COPILOT_HISTORY_MYSQL=1 \
          ARCENTRA_COPILOT_HISTORY_MYSQL_DSN="root:ci-only-mysql-password@tcp(127.0.0.1:13306)/$schema?charset=utf8mb4&parseTime=True&loc=UTC" \
            go test -race -v -count=1 -timeout=3m -run '^TestCopilotHistoryMySQLRealRequiredGate$' ./internal/control/repo | tee .acceptance/evidence/copilot-history-mysql.log
          python3 scripts/acceptance/verify_copilot_history_mysql_log.py .acceptance/evidence/copilot-history-mysql.log

      - name: Verify bound Copilot execution against disposable MySQL
        timeout-minutes: 4
        run: |
          set -o pipefail
          schema=arcentra_copilot_execution_test_ci
          docker compose -f scripts/acceptance/compose.yml exec -T -e MYSQL_PWD=ci-only-mysql-password mysql mysqladmin -uroot create "$schema"
          ARCENTRA_REQUIRE_COPILOT_EXECUTION_MYSQL=1 \
          ARCENTRA_COPILOT_EXECUTION_MYSQL_DSN="root:ci-only-mysql-password@tcp(127.0.0.1:13306)/$schema?charset=utf8mb4&parseTime=True&loc=UTC" \
            go test -race -v -count=1 -timeout=3m -run '^TestCopilotExecutionMySQLRealRequiredGate$' ./internal/control/repo | tee .acceptance/evidence/copilot-execution-mysql.log
          python3 scripts/acceptance/verify_copilot_execution_mysql_log.py .acceptance/evidence/copilot-execution-mysql.log

      - name: Verify terminal rerun durable boundaries against disposable MySQL
        timeout-minutes: 9
        run: |
          set -o pipefail
          schema=arcentra_copilot_rerun_test_ci
          docker compose -f scripts/acceptance/compose.yml exec -T -e MYSQL_PWD=ci-only-mysql-password mysql mysqladmin -uroot create "$schema"
          ARCENTRA_REQUIRE_COPILOT_RERUN_MYSQL=1 \
          ARCENTRA_COPILOT_RERUN_MYSQL_DSN="root:ci-only-mysql-password@tcp(127.0.0.1:13306)/$schema?charset=utf8mb4&parseTime=True&loc=UTC" \
            go test -race -v -count=1 -timeout=8m -run '^TestCopilotRerun(Confirm|Schema|Seal|Claim|Reports|Expiry|Dispatch|CancelActor)MySQLRequiredGate$' ./internal/control/repo | tee .acceptance/evidence/copilot-rerun-mysql.log
          python3 scripts/acceptance/verify_copilot_rerun_mysql_log.py .acceptance/evidence/copilot-rerun-mysql.log

      - name: Check out pinned frontend acceptance client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: arcentrix/arcentra-web
          # Reviewed acceptance client: immutable cross-repository dependency.
          ref: 04c209e3769d100bbee1e5f258ad1f9c5d19d05c
          path: .acceptance/frontend
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .acceptance/frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: .acceptance/frontend/pnpm-lock.yaml

      - name: Install locked frontend and official Chromium
        working-directory: .acceptance/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Exercise fresh installation through actual browser
        env:
          ARCENTRA_ACCEPTANCE_INBOX_JOURNEY: "1"
          ARCENTRA_ACCEPTANCE_COPILOT_HISTORY: "1"
        run: |
          python3 scripts/acceptance/run_actual_app.py \
            --visual-editor-acceptance \
            --control-bin "$PWD/.acceptance/bin/arcentra" \
            --agent-bin "$PWD/.acceptance/bin/arcentra-agent" \
            --cli-bin "$PWD/.acceptance/bin/arcentra-cli" \
            --evidence-dir "$PWD/.acceptance/evidence" \
            --browser-cwd "$PWD/.acceptance/frontend" \
            -- node tests/actual-backend-acceptance.mjs

      - name: Preserve sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: actual-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .acceptance/evidence/browser/*.png
            .acceptance/evidence/browser/summary.json
            .acceptance/evidence/browser/project-build-verification.json
            .acceptance/evidence/browser/visual-ci-verification.json
            .acceptance/evidence/copilot-history-verification.json
            .acceptance/evidence/copilot-history-create/summary.json
            .acceptance/evidence/copilot-history-create/copilot-history-receipt.json
            .acceptance/evidence/copilot-history-resume/summary.json
            .acceptance/evidence/copilot-history-resume/copilot-history-receipt.json
            .acceptance/evidence/inbox-verification.json
            .acceptance/evidence/inbox-read/*.png
            .acceptance/evidence/inbox-read/summary.json
            .acceptance/evidence/inbox-resume/*.png
            .acceptance/evidence/inbox-resume/summary.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Dependency diagnostics
        if: failure()
        run: docker compose -f scripts/acceptance/compose.yml logs --no-color --tail=100

      - name: Remove only this run's disposable services
        if: always()
        run: docker compose -f scripts/acceptance/compose.yml down --volumes --remove-orphans --timeout 15
