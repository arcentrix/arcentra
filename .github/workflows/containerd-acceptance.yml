name: Containerd runtime acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Runs untrusted PR code only in a disposable GitHub VM, without secrets, write
# permissions, persistent checkout credentials, production data or host sockets
# inside job containers. Never change this to pull_request_target/self-hosted.
permissions:
  contents: read

concurrency:
  group: containerd-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Rootful daemon / non-root Agent acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local
      ARCENTRA_REAL_STACK: "1"
      ARCENTRA_REQUIRE_REAL_STACK: "1"
      # Same literal as the pinned frontend checkout; verified before any browser/daemon.
      ARCENTRA_COPILOT_BROWSER_FRONTEND_COMMIT: a70ab0c866135f95d74ae89f44e7405053d3f061
      ARCENTRA_TEST_S3_ENDPOINT: http://127.0.0.1:19000
      ARCENTRA_TEST_S3_ACCESS_KEY: ci-only-s3-user
      ARCENTRA_TEST_S3_SECRET_KEY: ci-only-s3-password
      COMPOSE_PROJECT_NAME: arcentra-containerd-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out exact source under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            scripts/acceptance/minio.Dockerfile

      # Reuse the ordinary CI browser stack on this same disposable VM. It does
      # not enter a job container or change the sandbox network/daemon policy.
      - name: Check out pinned frontend acceptance client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: arcentrix/arcentra-web
          # Reviewed execution-enabled client: immutable cross-repository dependency.
          ref: a70ab0c866135f95d74ae89f44e7405053d3f061
          path: .acceptance/frontend
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .acceptance/frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: .acceptance/frontend/pnpm-lock.yaml

      - name: Prepare pinned real browser client within the existing job budget
        working-directory: .acceptance/frontend
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/arcentra-playwright" >> "$GITHUB_ENV"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/arcentra-playwright"
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm test:browser:harness
          test -f tests/actual-copilot-execution-acceptance.mjs
          test -f tests/actual-rerun-browser.mjs

      - name: Check harness without privilege and compile real tests
        run: |
          bash -n scripts/acceptance/run_containerd_runtime.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/acceptance -p 'test_containerd_runtime.py' -v
          make deps-check
          make codegen
          make fmt-check
          go test -race -count=1 -tags=sandbox_acceptance -run '^(TestContainerAcceptancePolicy.*|TestContainerAcceptanceFailedStepPolicyGuards|TestContainerAcceptanceFailedStepApprovalGuards|TestFailedStepApproval.*|TestRealContainerAcceptanceGate|TestRealContainerStepRetryAcceptanceGate|TestContainerAcceptanceObserverGuards|TestAcceptanceWorker.*|TestContainerCopilot.*|TestContainerTerminalRerun.*)$' ./internal/control/process ./internal/agent/taskqueue ./pkg/sandbox
          go test -race -tags=sandbox_acceptance ./internal/control/router -run '^(TestCopilotRerunFullRouteGroupIdentityAndLegacyIsolation|TestCopilotRerunProductionRouterDefaultOff|TestCopilotRerunHTTPStaticErrors)$' -count=1 -timeout=2m -v
          mkdir -p .acceptance/containerd-bin .acceptance/containerd-evidence
          go test -race -tags=sandbox_acceptance -c -o .acceptance/containerd-bin/sandbox.test ./pkg/sandbox
          go test -race -tags=sandbox_acceptance -c -o .acceptance/containerd-bin/sandboxexec.test ./internal/agent/sandboxexec
          go test -race -tags=sandbox_acceptance -c -o .acceptance/containerd-bin/taskqueue.test ./internal/agent/taskqueue

      - name: Check out pinned official MinIO source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: minio/minio
          ref: 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a # RELEASE.2025-10-15T17-29-55Z
          path: .acceptance/minio-source
          persist-credentials: false

      - name: Build disposable S3 fixture
        timeout-minutes: 8
        run: |
          test "$(git -C .acceptance/minio-source rev-parse HEAD)" = 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
          mkdir -p .acceptance/minio-image
          (cd .acceptance/minio-source && CGO_ENABLED=0 go build -mod=readonly -trimpath -o ../minio-image/minio .)
          cp .acceptance/minio-source/LICENSE .acceptance/minio-source/NOTICE .acceptance/minio-image/
          docker build -f scripts/acceptance/minio.Dockerfile -t arcentra-ci-minio:9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a .acceptance/minio-image

      - name: Start synthetic loopback dependencies
        run: |
          echo '::add-mask::ci-only-mysql-password'
          echo '::add-mask::ci-only-s3-password'
          docker compose -f scripts/acceptance/compose.yml up -d --wait --wait-timeout 180
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:19000/minio/health/ready >/dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then exit 1; fi
            sleep 2
          done
          go run scripts/acceptance/create_bucket.go
          docker compose -f scripts/acceptance/compose.yml exec -T -e MYSQL_PWD=ci-only-mysql-password mysql mysqladmin -uroot create arcentra_acceptance_containerd

      - name: Exercise owned containerd and full Process to S3 job
        timeout-minutes: 19
        run: scripts/acceptance/run_containerd_runtime.sh

      - name: Remove only this run's disposable dependencies
        if: always()
        run: docker compose -f scripts/acceptance/compose.yml down --volumes --remove-orphans --timeout 15

      - name: Retain bounded acceptance receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: containerd-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .acceptance/containerd-evidence/image.json
            .acceptance/containerd-evidence/versions.txt
            .acceptance/containerd-evidence/cleanup.json
            .acceptance/containerd-evidence/copilot-browser/summary.json
            .acceptance/containerd-evidence/copilot-browser/copilot-execution-receipt.json
            .acceptance/containerd-evidence/copilot-browser/terminal-rerun-prepare/summary.json
            .acceptance/containerd-evidence/copilot-browser/terminal-rerun-prepare/copilot-rerun-preparation-receipt.json
            .acceptance/containerd-evidence/copilot-browser/terminal-rerun-outcome/summary.json
            .acceptance/containerd-evidence/copilot-browser/terminal-rerun-outcome/copilot-rerun-outcome-receipt.json
            .acceptance/containerd-evidence/copilot-browser/terminal-rerun-owner-outcome/summary.json
            .acceptance/containerd-evidence/copilot-browser/terminal-rerun-owner-outcome/copilot-rerun-owner-outcome-receipt.json
            .acceptance/containerd-evidence/copilot-browser/terminal-rerun-runtime-receipt.json
          if-no-files-found: ignore
          retention-days: 7
